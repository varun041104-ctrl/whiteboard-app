apiVersion: apps/v1
kind: Deployment
metadata:
  name: whiteboard-app
spec:
  replicas: 3   # At least three replicas for Task 3 (excellent rubric band)
  selector:
    matchLabels:
      app: whiteboard
  template:
    metadata:
      labels:
        app: whiteboard
    spec:
      containers:
        - name: whiteboard
          image: yourdockerhubusername/whiteboard-app:v1   # Replace with your Docker Hub repo
          ports:
            - containerPort: 5001
          env:
            - name: REDIS_HOST
              value: "redis-server"   # Use Redis service name, not IP
          resources:
            requests:
              cpu: "200m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 5001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 5001
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: whiteboard-service
spec:
  type: NodePort
  selector:
    app: whiteboard
  ports:
    - port: 5001
      targetPort: 5001
      nodePort: 30001   # Optional: fix external port for consistency